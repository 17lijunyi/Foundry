<!doctype html>
<html data-theme="light" data-surface="solid" data-color-scheme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Foundry" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Foundry" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4E5969" />
    <link rel="icon" type="image/png" href="./pwa/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa/icon-180.png" />
    <title>Foundry</title>
    <script>
      // Restore appearance and material together before the first frame.
      (function () {
        try {
          var theme = localStorage.getItem('__aionui_theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
          var surface = localStorage.getItem('__aionui_surface');
          if (surface === 'solid' || surface === 'glass') {
            document.documentElement.setAttribute('data-surface', surface);
          } else if (theme) {
            // Old installations and custom themes used glass before this cache existed.
            document.documentElement.setAttribute('data-surface', 'glass');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // Set arco-theme on body synchronously
      try {
        var t = localStorage.getItem('__aionui_theme');
        if (t === 'light' || t === 'dark') document.body.setAttribute('arco-theme', t);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
